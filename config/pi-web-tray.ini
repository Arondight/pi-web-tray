; Pi Web Tray configuration sample
; Pi Web Tray 配置样例
;
; The tray reads %LOCALAPPDATA%\pi-web-tray\pi-web-tray.ini by default.
; To use a pi-web-tray.ini beside the executable, set PI_WEB_TRAY_PORTABLE=1.
; 托盘默认读取 %LOCALAPPDATA%\pi-web-tray\pi-web-tray.ini。
; 如需使用可执行文件旁的 pi-web-tray.ini，请设置 PI_WEB_TRAY_PORTABLE=1。
;
; Comments begin with ';' or '#'. An inline comment requires whitespace before
; the comment marker. Values support %ENV% expansion; values containing ';' or
; '#' may be enclosed in quotes.
; 注释以 ; 或 # 开头；行尾注释符号前需要空白。值支持 %ENV% 环境变量展开；
; 包含 ; 或 # 的值可以使用引号包裹。

; pi-web listening port (default: 30141)
; pi-web 监听端口（默认：30141）
Port=30141

; Service working directory; also serves as pi's default project directory
; 服务工作目录，同时也是 pi 的默认项目目录
WorkingDir=%USERPROFILE%

; Install pi-web automatically when missing (1 = enabled, 0 = disabled)
; 缺少 pi-web 时自动安装（1 = 启用，0 = 禁用）
AutoInstall=1

; Restart pi-web automatically if it stops unexpectedly (1 = enabled, 0 = disabled)
; pi-web 意外停止时自动重启（1 = 启用，0 = 禁用）
AutoRestart=0

; Check for Pi Web Tray updates at startup (1 = enabled, 0 = disabled)
; 启动时检查 Pi Web Tray 更新（1 = 启用，0 = 禁用）
AutoCheckUpdates=0

; Also install the pi command-line tool (1 = enabled, 0 = disabled)
; 同时安装 pi 命令行工具（1 = 启用，0 = 禁用）
InstallPiCli=1

; npm distribution tag or exact version (for example latest or 0.1.0)
; npm 分发标签或具体版本号（例如 latest 或 0.1.0）
InstallTag=latest

; Custom npm registry; empty uses the npm default
; Example: https://registry.npmmirror.com
; 自定义 npm 源；留空时使用 npm 默认值
; 示例：https://registry.npmmirror.com
NpmRegistry=

; Optional explicit paths; leave empty for automatic detection
; NodePath: node.exe
; ServerScript: pi-web.js
; 可选显式路径；留空时自动检测
; NodePath：node.exe
; ServerScript：pi-web.js
NodePath=
ServerScript=

; Use administrator rights for start at login (maintained by the tray menu)
; 开机自启动是否使用管理员权限（由托盘菜单维护）
AutostartAdmin=0

; UI language: auto (follow Windows), en, zh (Simplified), zh-Hant (Traditional)
; 界面语言：auto（跟随 Windows）、en、zh（简体）、zh-Hant（繁体）
Language=auto
