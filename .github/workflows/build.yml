name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' |
            Select-Object Version, Release

      - name: Build
        shell: cmd
        run: build.cmd --no-pause

      - name: Verify Windows 7-11 compatibility
        shell: pwsh
        run: .\scripts\check-compat.ps1 -ArtifactDir artifacts

      - name: Check .NET formatting
        shell: pwsh
        run: dotnet format PiWebTray.sln --no-restore --verify-no-changes

      - name: Check documentation formatting
        shell: pwsh
        run: npx --yes prettier@3.9.6 --check "**/*.{md,yml,yaml,json}"

      - name: Unit tests
        shell: pwsh
        run: dotnet test tests\PiWebTray.Tests\PiWebTray.Tests.csproj -c Release --nologo

      - name: Smoke tests
        shell: pwsh
        run: .\scripts\verify.ps1 -ExePath artifacts\pi-web-tray.exe

      - name: Package release candidate
        shell: pwsh
        run: .\scripts\package-release.ps1 -ArtifactDir artifacts

      - name: Smoke test release archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts\pi-web-tray-*-win.zip | Select-Object -First 1
          if ($null -eq $zip) { throw "Release archive was not created" }
          $dir = Join-Path $env:RUNNER_TEMP "pi-web-tray-package"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $dir
          .\scripts\verify.ps1 -ExePath (Join-Path $dir "pi-web-tray.exe")

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-web-tray
          path: |
            artifacts/pi-web-tray.exe
            artifacts/pi-web-tray.exe.config
            artifacts/zh-Hans/**
            artifacts/zh-Hant/**
            artifacts/pi-web-tray-*-win.zip
            artifacts/pi-web-tray-*-win.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-web-tray
          path: artifacts

      - name: Verify tag matches the product version
        shell: pwsh
        run: |
          $version = (Get-Item artifacts/pi-web-tray.exe).VersionInfo.ProductVersion
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match product version $version (expected $expected)"
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/pi-web-tray-*-win.zip
            artifacts/pi-web-tray-*-win.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
